<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#0B0B0D"/>
    </linearGradient>
    <linearGradient id="blueMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="blueDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="aluminum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="510" rx="310" ry="35" fill="#000000" opacity="0.7"/>
  <ellipse cx="400" cy="495" rx="200" ry="20" fill="#2563EB" opacity="0.15"/>

  <!-- Gazebo Structure -->
  <g filter="url(#shadow)">
    <!-- Back wall (Blue geometric facets) -->
    <polygon points="270,230 530,230 530,450 270,450" fill="url(#blueDark)"/>
    <!-- Facet details -->
    <polygon points="270,230 400,320 270,390" fill="#1E3A8A" opacity="0.6"/>
    <polygon points="400,320 530,230 530,360" fill="#3B82F6" opacity="0.4"/>
    <polygon points="400,320 530,360 400,450" fill="#1D4ED8" opacity="0.5"/>
    <polygon points="270,390 400,320 400,450" fill="#2563EB" opacity="0.3"/>

    <!-- Half Side Walls -->
    <polygon points="180,260 270,230 270,450 180,480" fill="#1E40AF"/>
    <polygon points="530,230 620,260 620,480 530,450" fill="#1D4ED8"/>

    <!-- Half Wall Front Bar & Panel -->
    <polygon points="180,390 400,410 400,480 180,480" fill="url(#blueMain)"/>
    <polygon points="400,410 620,390 620,480 400,480" fill="#1D4ED8"/>

    <!-- Scissors Pop-Up Truss Bars inside roof -->
    <line x1="270" y1="230" x2="530" y2="250" stroke="#CBD5E1" stroke-width="3" opacity="0.7"/>
    <line x1="530" y1="230" x2="270" y2="250" stroke="#CBD5E1" stroke-width="3" opacity="0.7"/>

    <!-- 4 Aluminum Telescopic Legs with Push Pin Slots -->
    <rect x="266" y="225" width="8" height="230" fill="url(#aluminum)"/>
    <rect x="526" y="225" width="8" height="230" fill="url(#aluminum)"/>
    <rect x="176" y="250" width="10" height="235" fill="url(#aluminum)"/>
    <rect x="614" y="250" width="10" height="235" fill="url(#aluminum)"/>

    <!-- Roof Pyramid Canopy (High Peak) -->
    <!-- Left Roof Slant -->
    <polygon points="400,80 180,230 400,255" fill="url(#blueDark)"/>
    <!-- Right Roof Slant -->
    <polygon points="400,80 400,255 620,230" fill="url(#blueMain)"/>

    <!-- Geometric Facets on Roof -->
    <polygon points="400,80 300,190 400,255" fill="#3B82F6" opacity="0.35"/>
    <polygon points="400,80 490,190 400,255" fill="#60A5FA" opacity="0.25"/>

    <!-- Front Valance Overhang -->
    <polygon points="180,230 400,255 400,285 180,260" fill="#1E3A8A"/>
    <polygon points="400,255 620,230 620,260 400,285" fill="#1D4ED8"/>

    <!-- Printed White Crown Insignia on Roof -->
    <path d="M 380,160 L 400,135 L 420,160 L 410,180 L 390,180 Z" fill="#FFFFFF" opacity="0.95"/>
    <text x="400" y="273" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PREMIUM FOLDING GAZEBO</text>

    <text x="290" y="445" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#FFFFFF" text-anchor="middle">3x3 METERS POP-UP</text>
    <text x="510" y="445" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#E2E8F0" text-anchor="middle">WATERPROOF 600D</text>
  </g>

  <!-- Top Badge -->
  <rect x="30" y="30" width="180" height="32" rx="6" fill="#1E293B" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="50" cy="46" r="6" fill="#2563EB"/>
  <text x="66" y="51" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">COMMERCIAL GAZEBO</text>
</svg>
