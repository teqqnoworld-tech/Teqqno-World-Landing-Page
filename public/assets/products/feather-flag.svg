<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#0B0B0D"/>
    </linearGradient>
    <linearGradient id="flagRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="60%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="flagBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26262B"/>
      <stop offset="50%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Plaza Tiles / Pavement Grid line ground -->
  <ellipse cx="400" cy="530" rx="330" ry="35" fill="#000000" opacity="0.75"/>

  <!-- Flag 1 (Left - Red) -->
  <g filter="url(#shadow)" transform="translate(240, 260) scale(0.85)">
    <!-- Base Cross Stand + Water Donut -->
    <polygon points="-60,285 60,285 50,295 -50,295" fill="#64748B"/>
    <ellipse cx="0" cy="285" rx="45" ry="12" fill="#475569"/>
    <ellipse cx="0" cy="285" rx="14" ry="4" fill="#1E293B"/>

    <!-- Carbon Fiber Curved Pole -->
    <path d="M 0,285 L 0,30 Q 0,-210 110,-240" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>

    <!-- Feather Flag Fabric Sail -->
    <path d="M 0,30 L 0,-200 Q 0,-240 110,-240 Q 140,-150 130,50 Q 80,110 0,30 Z" fill="url(#flagRed)"/>
    
    <!-- Bold Vertical Branding -->
    <text x="55" y="-60" font-family="'Inter', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 55 -60)" letter-spacing="4">FEATHER</text>
  </g>

  <!-- Flag 2 (Center Hero - Black & Red) -->
  <g filter="url(#shadow)" transform="translate(420, 250)">
    <!-- Base Cross Stand + Heavy Grey Water Donut Weight -->
    <polygon points="-75,275 75,275 65,288 -65,288" fill="#94A3B8"/>
    <polygon points="0,265 15,280 -15,280" fill="#64748B"/>
    <ellipse cx="0" cy="275" rx="55" ry="15" fill="#475569"/>
    <ellipse cx="0" cy="275" rx="18" ry="5" fill="#0F172A"/>

    <!-- Carbon Fiber Pole -->
    <path d="M 0,275 L 0,20 Q 0,-230 130,-260" fill="none" stroke="#09090B" stroke-width="10" stroke-linecap="round"/>

    <!-- Feather Flag Fabric Blade -->
    <path d="M 0,20 L 0,-220 Q 0,-260 130,-260 Q 160,-170 150,50 Q 90,120 0,20 Z" fill="url(#flagBlack)" stroke="#DC2626" stroke-width="2"/>

    <!-- Lower Red Accent Wave -->
    <path d="M 0,-40 Q 90,-20 145,-10 L 150,50 Q 90,120 0,20 Z" fill="url(#flagRed)"/>

    <!-- Vertical SKIL-style Headline -->
    <text x="65" y="-85" font-family="'Inter', sans-serif" font-weight="900" font-size="42" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 65 -85)" letter-spacing="6">TEQQNO</text>
    
    <!-- Flag Lower Sub-bullets -->
    <g transform="translate(70, 0)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">★ FEATHER FLAG ★</text>
      <text x="0" y="16" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#E2E8F0" text-anchor="middle">ALL-WEATHER FABRIC</text>
    </g>
  </g>

  <!-- Flag 3 (Right - Red & Black) -->
  <g filter="url(#shadow)" transform="translate(590, 260) scale(0.85)">
    <!-- Base Cross Stand + Water Donut -->
    <polygon points="-60,285 60,285 50,295 -50,295" fill="#64748B"/>
    <ellipse cx="0" cy="285" rx="45" ry="12" fill="#475569"/>
    <ellipse cx="0" cy="285" rx="14" ry="4" fill="#1E293B"/>

    <!-- Pole -->
    <path d="M 0,285 L 0,30 Q 0,-210 110,-240" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>

    <!-- Sail -->
    <path d="M 0,30 L 0,-200 Q 0,-240 110,-240 Q 140,-150 130,50 Q 80,110 0,30 Z" fill="url(#flagRed)"/>
    <text x="55" y="-60" font-family="'Inter', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 55 -60)" letter-spacing="4">OUTDOOR</text>
  </g>

  <!-- Top Badge -->
  <rect x="30" y="30" width="180" height="32" rx="6" fill="#1E293B" stroke="#DC2626" stroke-width="1.5"/>
  <circle cx="50" cy="46" r="6" fill="#DC2626"/>
  <text x="66" y="51" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">FEATHER FLAG SIGNAGE</text>
</svg>
