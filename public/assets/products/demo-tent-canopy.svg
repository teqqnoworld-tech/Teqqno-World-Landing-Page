<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#0B0B0D"/>
    </linearGradient>
    <linearGradient id="canopyTop" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#028090"/>
      <stop offset="50%" stop-color="#00A896"/>
      <stop offset="100%" stop-color="#026b77"/>
    </linearGradient>
    <linearGradient id="canopyLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008170"/>
      <stop offset="100%" stop-color="#005B41"/>
    </linearGradient>
    <linearGradient id="canopyRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A896"/>
      <stop offset="100%" stop-color="#028090"/>
    </linearGradient>
    <linearGradient id="valance" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#026b77"/>
      <stop offset="50%" stop-color="#00A896"/>
      <stop offset="100%" stop-color="#028090"/>
    </linearGradient>
    <linearGradient id="aluminum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D1D5DB"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Studio Floor & Radial Glow -->
  <ellipse cx="400" cy="510" rx="320" ry="40" fill="#000000" opacity="0.7"/>
  <ellipse cx="400" cy="490" rx="220" ry="25" fill="#00A896" opacity="0.12"/>

  <!-- Tent Assembly -->
  <g filter="url(#shadow)">
    <!-- Rear Back Wall Graphics -->
    <polygon points="260,240 540,240 540,460 260,460" fill="#00777B" opacity="0.85"/>
    <!-- Medical Cross & Brand on Back Wall -->
    <path d="M 380,310 H 420 V 335 H 445 V 375 H 420 V 400 H 380 V 375 H 355 V 335 H 380 Z" fill="#FFFFFF" opacity="0.9"/>
    <text x="400" y="290" font-family="'Inter', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">DEMO TENT CANOPY</text>
    <text x="400" y="435" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#E0F2FE" text-anchor="middle" letter-spacing="1">PROMOTIONAL DISPLAY BOOTH</text>

    <!-- Side Half Wall Left -->
    <polygon points="180,260 260,240 260,460 180,480" fill="url(#canopyLeft)"/>
    <text x="215" y="380" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" transform="rotate(-14 215 380)" opacity="0.9">BRAND PROMO</text>

    <!-- Front Half Wall Wrap -->
    <polygon points="180,380 500,400 500,480 180,480" fill="url(#canopyRight)"/>
    <polygon points="500,400 620,380 620,460 500,480" fill="#006666"/>
    <text x="340" y="440" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" text-anchor="middle">EXHIBITION BRANDING</text>
    <text x="340" y="460" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#E2E8F0" text-anchor="middle">Weatherproof UV Flex Media</text>

    <!-- Aluminum Frame Legs -->
    <!-- Rear Legs -->
    <rect x="256" y="240" width="8" height="225" fill="url(#aluminum)"/>
    <rect x="536" y="240" width="8" height="225" fill="url(#aluminum)"/>
    <!-- Front Legs -->
    <rect x="176" y="250" width="10" height="240" fill="url(#aluminum)"/>
    <rect x="614" y="250" width="10" height="220" fill="url(#aluminum)"/>

    <!-- Canopy Roof Pyramid Peak -->
    <!-- Left Roof Face -->
    <polygon points="400,90 180,230 400,260" fill="url(#canopyLeft)"/>
    <!-- Right Roof Face -->
    <polygon points="400,90 400,260 620,230" fill="url(#canopyTop)"/>

    <!-- Valance / Front Overhang -->
    <!-- Left Valance -->
    <polygon points="180,230 400,260 400,290 180,260" fill="url(#valance)"/>
    <!-- Right Valance -->
    <polygon points="400,260 620,230 620,260 400,290" fill="#007F80"/>

    <!-- Roof Logo & Text -->
    <text x="300" y="260" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" transform="rotate(7 300 260)">★ TEQQNOWORLD</text>
    <text x="490" y="255" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" transform="rotate(-7 490 255)">PROMO CANOPY ★</text>
  </g>

  <!-- Top Badge -->
  <rect x="30" y="30" width="180" height="32" rx="6" fill="#1E293B" stroke="#00A896" stroke-width="1.5"/>
  <circle cx="50" cy="46" r="6" fill="#00A896"/>
  <text x="66" y="51" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">10x10 FT DEMO TENT</text>
</svg>
